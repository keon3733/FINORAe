<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#43158B">
<meta name="description" content="Finora: track income, expenses, budgets and savings goals.">
<title>Finora</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: deep-purple sidebar + airy lavender canvas on desktop; bottom tab bar with a raised "+" on phones. Purple leads, green only signals progress. */
:root{
  --bg:#FAF9FE; --surface:#FFFFFF; --surface2:#F5F1FF; --lav:#F2ECFF; --border:#E9E3F6;
  --fg:#1F2937; --muted:#687280; --faint:#9AA1AE;
  --primary:#7028E4; --primary-ink:#FFFFFF; --primary-soft:#F2ECFF; --deep:#43158B;
  --green:#22C55E; --green-ink:#15803D; --green-soft:#E7F8EE;
  --red:#E5484D; --red-ink:#C2272D; --red-soft:#FDECEC;
  --amber:#F59E0B; --amber-ink:#B45309; --amber-soft:#FEF3DC;
  --side:#43158B; --side2:#2E0E63; --side-fg:#F3EEFF; --side-muted:#BBA6EA;
  --shadow:0 1px 2px rgba(67,21,139,.05),0 8px 24px rgba(67,21,139,.06);
  --shadow-lg:0 20px 60px rgba(40,10,90,.25);
  --ring:0 0 0 3px rgba(112,40,228,.28);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --c-food:#7028E4; --c-transport:#D159C4; --c-bills:#4F7DF3; --c-shopping:#22C55E; --c-health:#F59E0B; --c-fun:#14B8A6; --c-others:#8B7FA8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110B20; --surface:#1B1330; --surface2:#231942; --lav:#2A1E52; --border:#31265A;
  --fg:#F3EEFF; --muted:#A99DC4; --faint:#7C719A;
  --primary:#9466FF; --primary-ink:#12081F; --primary-soft:#2A1E52; --deep:#CDB8FF;
  --green:#34D673; --green-ink:#4ADE80; --green-soft:#12301F;
  --red:#FF6B70; --red-ink:#FF8E92; --red-soft:#3A1A24;
  --amber:#FBBF24; --amber-ink:#FCD34D; --amber-soft:#3A2D12;
  --side:#1A0F36; --side2:#12092A; --side-fg:#F3EEFF; --side-muted:#A18FCF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ring:0 0 0 3px rgba(148,102,255,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110B20; --surface:#1B1330; --surface2:#231942; --lav:#2A1E52; --border:#31265A;
  --fg:#F3EEFF; --muted:#A99DC4; --faint:#7C719A;
  --primary:#9466FF; --primary-ink:#12081F; --primary-soft:#2A1E52; --deep:#CDB8FF;
  --green:#34D673; --green-ink:#4ADE80; --green-soft:#12301F;
  --red:#FF6B70; --red-ink:#FF8E92; --red-soft:#3A1A24;
  --amber:#FBBF24; --amber-ink:#FCD34D; --amber-soft:#3A2D12;
  --side:#1A0F36; --side2:#12092A; --side-fg:#F3EEFF; --side-muted:#A18FCF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --ring:0 0 0 3px rgba(148,102,255,.4);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{margin:0;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.pos{color:var(--green-ink)} .neg{color:var(--red-ink)}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14px;transition:transform .12s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 6px 16px rgba(112,40,228,.28)}
.btn-primary:hover{box-shadow:0 8px 22px rgba(112,40,228,.4)}
.btn-ghost{border:1.5px solid var(--border);background:var(--surface)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}
.btn-danger{background:var(--red-soft);color:var(--red-ink)}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--primary);font-weight:600}
.link:hover{text-decoration:underline}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,.select,.textarea{width:100%;min-height:46px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:0 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.textarea{padding:12px 14px;min-height:80px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
.input::placeholder{color:var(--faint)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg{position:absolute;left:14px;color:var(--faint);width:18px;height:18px}
.input-wrap>.input{padding-left:42px}
.input-wrap .toggle{position:absolute;right:10px;font-size:12px;font-weight:700;color:var(--primary);padding:6px}
.amount-input{font-size:28px;font-weight:800;min-height:64px;letter-spacing:-.02em}
.err{color:var(--red-ink);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.hint{font-size:12.5px;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:2px}
.seg button{min-height:36px;padding:0 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(40,10,90,.15)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--green-soft);color:var(--green-ink)} .pill.warn{background:var(--amber-soft);color:var(--amber-ink)} .pill.bad{background:var(--red-soft);color:var(--red-ink)} .pill.info{background:var(--primary-soft);color:var(--primary)}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;font-size:24px;color:var(--deep)}
.logo svg{width:auto;height:1.3em}
.logo.light{color:#fff}

/* ---------- landing ---------- */
.land{background:radial-gradient(1200px 600px at 75% 0%,#5B1FC0 0%,transparent 60%),linear-gradient(160deg,#2A0E63 0%,#1B0A40 100%);color:#fff;min-height:100vh;overflow:hidden}
.land-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;max-width:1200px;margin:0 auto}
.land-nav nav{display:flex;gap:28px;font-size:14px;font-weight:600;color:#D9CCFA}
.land-nav .acts{display:flex;gap:10px;align-items:center}
.land .btn-ghost{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.land .btn-ghost:hover{border-color:#fff;color:#fff}
.land .btn-primary{background:#8A4DFF;color:#fff}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1200px;margin:0 auto;padding:32px 24px 56px}
.hero h1{font-size:clamp(38px,5.6vw,68px);line-height:1.04;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:#B98CFF}
.hero p.lead{margin-top:22px;font-size:18px;color:#D9CCFA;max-width:34rem;line-height:1.6}
.hero .cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero .cta .btn{min-height:52px;padding:0 28px;font-size:15px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1200px;margin:0 auto;padding:0 24px 64px}
.feat div{display:grid;gap:6px;align-content:start}
.feat .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#CBB0FF;margin-bottom:6px}
.feat b{font-size:15px}.feat span{font-size:13px;color:#C9B9EE}
.phone{width:min(300px,100%);margin:0 auto;border-radius:44px;background:#0E0620;padding:10px;box-shadow:var(--shadow-lg),0 0 0 2px #3a2370;position:relative;transform:rotate(3deg)}
.phone-in{border-radius:34px;background:var(--bg);color:var(--fg);padding:18px 16px 20px;display:grid;gap:12px;overflow:hidden}
.phone .ph-bal{background:linear-gradient(135deg,#7028E4,#43158B);color:#fff;border-radius:18px;padding:14px}
.phone .ph-bal b{font-size:26px;display:block;letter-spacing:-.02em}
.float-card{position:absolute;right:-28px;top:100px;background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-lg);font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center;transform:rotate(-3deg)}
.float-card.b{right:auto;left:-34px;top:auto;bottom:6px}
.land-foot{max-width:1200px;margin:0 auto;padding:0 24px 40px;color:#B9A6E6;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);min-height:100vh;background:var(--surface)}
.auth-form{display:grid;align-content:center;justify-items:center;padding:32px 24px}
.auth-card{width:min(420px,100%);display:grid;gap:18px}
.auth-card h1{font-size:28px;font-weight:800}
.auth-side{background:linear-gradient(160deg,var(--lav),#D9C6FF);display:grid;align-content:space-between;padding:48px;position:relative;overflow:hidden}
.auth-side p{font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.03em;color:#43158B;max-width:14ch}
.auth-side svg.leaf{position:absolute;right:-40px;bottom:-30px;width:320px;opacity:.55}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12.5px}
.divider::before,.divider::after{content:"";height:1px;background:var(--border);flex:1}

/* ---------- onboarding ---------- */
.onb{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,var(--lav),var(--bg) 40%)}
.onb-card{width:min(560px,100%);background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:32px;display:grid;gap:20px;border:1px solid var(--border)}
.dots{display:flex;gap:6px}.dots i{height:5px;flex:1;border-radius:3px;background:var(--border)}.dots i.on{background:var(--primary)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--side-fg);display:flex;flex-direction:column;gap:6px;padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.side .logo{padding:0 10px 22px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-weight:600;color:var(--side-muted);width:100%;text-align:left;transition:background .15s,color .15s}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i[aria-current="page"]{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}
:root[data-theme="dark"] .nav-i[aria-current="page"]{color:#12081F}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1)}
.side-user .who{min-width:0;flex:1;line-height:1.25}
.side-user b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user span{font-size:11.5px;color:var(--side-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#9466FF,#22C55E);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.main{min-width:0;padding:20px 28px 40px;max-width:1240px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.top .input-wrap{flex:1;max-width:520px}
.top .input{background:var(--surface);min-height:44px;border-radius:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--border);color:var(--muted);position:relative;flex:none}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.badge-dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.top .sp{flex:1}
.m-top{display:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:26px;font-weight:800}
.page-head p{color:var(--muted);margin-top:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.card-h h2{font-size:15.5px;font-weight:700}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2b{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.kpi{display:grid;gap:4px;align-content:start}
.kpi .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.025em;overflow-wrap:anywhere}
.kpi .d{font-size:12px;font-weight:600;display:block;color:var(--muted)}
.kpi.hero-k{background:linear-gradient(135deg,#7028E4,#43158B);color:#fff;border:0}
.kpi.hero-k .l,.kpi.hero-k .d{color:#E3D6FF}
.kpi.hero-k .ic{background:rgba(255,255,255,.16);color:#fff}
.select-sm{min-height:36px;border-radius:10px;font-size:13px;font-weight:600;width:auto;padding:0 30px 0 12px}
.legend{display:grid;gap:10px;align-content:center;min-width:0}
.legend li{list-style:none;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.legend ul{margin:0;padding:0;display:grid;gap:10px}
.dot{width:10px;height:10px;border-radius:50%}
.donut-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.donut{position:relative;width:170px;height:170px}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ctr b{font-size:17px;font-weight:800;letter-spacing:-.02em}.donut .ctr span{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart-tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--shadow);z-index:3}
.legend-inline{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend-inline i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* transactions */
.tx{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 6px;border-radius:14px;width:100%;text-align:left;transition:background .15s}
button.tx:hover{background:var(--surface2)}
.tx .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.tx .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:800;font-size:14px;text-align:right}
.tx .a small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.day-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 6px 4px}
.shot-ic{display:inline-flex;vertical-align:-3px;margin-left:4px;color:var(--primary);width:14px;height:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .input-wrap{flex:1;min-width:220px}

/* insight */
.insight{background:linear-gradient(135deg,var(--green-soft),var(--surface));border-color:transparent;display:grid;gap:10px}
.insight.adv{background:linear-gradient(135deg,var(--primary-soft),var(--surface))}
.insight .h{display:flex;gap:10px;align-items:center;font-weight:700}
.insight .h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--green-ink)}
.insight.adv .h .ic{color:var(--primary)}
.insight p{color:var(--muted);font-size:13.5px;line-height:1.6}
.insight p b{color:var(--fg)}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.green>i{background:var(--green)} .bar.warn>i{background:var(--amber)} .bar.bad>i{background:var(--red)}
.bud{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--border)}
.bud:last-child{border:0}
.bud .row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.bud .nm{display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.goal{display:grid;gap:12px}
.goal .top2{display:flex;gap:12px;align-items:center}
.goal .gi{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.quick{display:grid;gap:10px}
.quick button{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:12px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);transition:border-color .15s,transform .12s}
.quick button:hover{border-color:var(--primary);transform:translateY(-1px)}
.quick .ic{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.quick b{display:block;font-size:14px}.quick span{font-size:12px;color:var(--muted)}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 16px}
.empty .ic{width:60px;height:60px;border-radius:18px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.empty p{color:var(--muted);max-width:34ch}

/* add flow */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.stepper li{list-style:none;display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.stepper ol{display:contents;margin:0;padding:0}
.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border);background:var(--surface);font-weight:800;font-size:13px;position:relative;z-index:1}
.stepper li::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--border)}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.cur::before{background:var(--primary)}
.stepper li.cur .n{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.shot img{width:100%;height:100%;object-fit:contain;display:block;max-height:480px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.cat-pick{display:flex;flex-wrap:wrap;gap:8px}
.progress{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:14px 0 6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--green));border-radius:99px;transition:width .4s}
.scan{position:relative}
.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent);box-shadow:0 0 14px var(--green);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:500;align-items:flex-start}
.notice.warn{background:var(--amber-soft);color:var(--amber-ink)}
.notice.info{background:var(--primary-soft);color:var(--fg)}
.notice.ok{background:var(--green-soft);color:var(--green-ink)}
.success{display:grid;justify-items:center;text-align:center;gap:12px;padding:20px 0}

.success .tick svg{width:36px;height:36px;stroke-width:2.6}

/* report */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(18,8,40,.55);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:16px;animation:fade .2s}

 home:P('M3 11l9-8 9 8M5 10v10h14V10'),list:P('M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'),plus:P('M12 5v14M5 12h14'),

 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/>'+P('M8 11V8a4 4 0 018 0v3'),logout:P('M10 4H5v16h5M15 8l4 4-4 4M19 12H9'),

 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/>'+P('M5 15V6a2 2 0 012-2h9'),alert:P('M12 9v4M12 17h.01')+P('M10.300 3.900L2.400 18a2 2 0 001.700 3h15.800a2 2 0 001.700-3L13.700 3.900a2 2 0 00-3.400 0z'),

 play:P('M8 5v14l11-7z'),dots:P('M5 12h.01M12 12h.01M19 12h.01'),income:P('M12 5v14M6 13l6 6 6-6'),swap:P('M7 7h13M16 3l4 4-4 4M17 17H4M8 13l-4 4 4 4'),
 undo:P('M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3'),briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/>'+P('M9 7V4h6v3M3 13h18'),gift:'<rect x="3" y="8" width="18" height="4" rx="1"/>'+P('M5 12v8h14v-8M12 8v12M12 8c-3 0-4-4-1.500-4S12 8 12 8zM12 8c3 0 4-4 1.500-4S12 8 12 8z'),
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/>'+P('M3 10h18M8 3v4M16 3v4'),cam:'<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13" r="3.500"/>'+P('M8 7l1.500-3h5L16 7'),

};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]||''}</svg>`;

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:null},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- dates & money ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const todayISO=()=>isoOf(new Date());
const addDaysISO=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d)};
const dayDiff=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const monthStart=s=>s.slice(0,8)+'01';
const addMonthsISO=(s,n)=>{const d=parseISO(monthStart(s));d.setMonth(d.getMonth()+n);return isoOf(d)};
const daysInMonth=s=>{const d=parseISO(monthStart(s));return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const fmtDay=(s,y)=>{const d=parseISO(s);return `${d.getDate()} ${MON[d.getMonth()]}${y?' '+d.getFullYear():''}`};
const monthLabel=s=>{const d=parseISO(s);return `${MONL[d.getMonth()]} ${d.getFullYear()}`};
const dayLabel=s=>{const t=todayISO();if(s===t)return'Today';if(s===addDaysISO(t,-1))return'Yesterday';const d=parseISO(s);return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`};
const minISO=(a,b)=>a<b?a:b;

const CUR={NGN:['₦','Nigerian naira'],USD:['$','US dollar'],GBP:['£','British pound'],EUR:['€','Euro'],GHS:['GH₵','Ghanaian cedi'],KES:['KSh ','Kenyan shilling'],ZAR:['R','South African rand']};
const sym=()=>CUR[(S.data&&S.data.profile.currency)||'NGN'][0];
const money=(n,o={})=>{const v=Math.abs(n);const dec=Math.abs(v-Math.round(v))>.004?2:0;const s=v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:2});return(n<0?'-':(o.plus&&n>0?'+':''))+sym()+s};
const compact=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n));
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const firstName=n=>(n||'').trim().split(/\s+/)[0]||'there';
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function hashPw(pw,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return'x'+h}
}

/* ---------- categories ---------- */
const EXP_CATS=['Food','Transport','Bills','Shopping','Health','Entertainment','Others'];

  Food:{c:'var(--c-food)',i:'utensils'},Transport:{c:'var(--c-transport)',i:'car'},Bills:{c:'var(--c-bills)',i:'bolt'},Shopping:{c:'var(--c-shopping)',i:'bag'},
  Health:{c:'var(--c-health)',i:'heart'},Entertainment:{c:'var(--c-fun)',i:'play'},Others:{c:'var(--c-others)',i:'dots'},

/* ---------- state ---------- */
const S={route:'landing',user:null,data:null,flow:null,modal:null,pop:null,edit:null,
  ui:{period:'month',q:'',type:'all',cat:'all',month:'all',limit:50,csv:null,repMonth:null,del:null,editBud:null,err:null,showPw:false,onb:1,onbD:{},authBusy:false,goalOpen:null}};

function newData(name,email){return{profile:{name,email,currency:'NGN',theme:'system',openingBalance:0,incomeSources:[],onboarded:false,demo:false},tx:[],budgets:{},goals:[],merchantMap:{},seenAlerts:0}}
function persist(){if(S.user&&S.data)store.set('finora:data:'+S.user,S.data)}
const accounts=()=>store.get('finora:accounts')||{};

/* ---------- theme ---------- */
function applyTheme(){
  const pref=(S.data&&S.data.profile.theme)||store.get('finora:theme')||'system';
  const r=document.documentElement;
  if(pref==='light'||pref==='dark')r.setAttribute('data-theme',pref);else r.removeAttribute('data-theme');
}
function setTheme(p){if(S.data){S.data.profile.theme=p;persist()}store.set('finora:theme',p);render()}

/* ---------- calculations ---------- */
function agg(start,end){

function guessCategory(text,type,merchant){

const MONRE='(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*';
function parseDate(text){
  const tIso=todayISO();let m,y,mo,d;
  const fix=yy=>yy<100?2000+yy:yy;
  const ok=(yy,mm,dd)=>{if(mm<1||mm>12||dd<1||dd>31)return null;const s=`${yy}-${pad(mm)}-${pad(dd)}`;const dt=parseISO(s);if(dt.getMonth()+1!==mm)return null;return s<=addDaysISO(tIso,1)&&s>addDaysISO(tIso,-1500)?s:null};
  if(m=text.match(new RegExp(`(\\d{1,2})(?:st|nd|rd|th)?[\\s\\-\\/,]+${MONRE}\\.?,?[\\s\\-\\/]+(\\d{4}|\\d{2})\\b`,'i'))){const r=ok(fix(+m[3]),MON.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase())+1,+m[1]);if(r)return r}
  if(m=text.match(new RegExp(`${MONRE}\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4})`,'i'))){const r=ok(+m[3],MON.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase())+1,+m[2]);if(r)return r}
  if(m=text.match(/(\d{4})-(\d{2})-(\d{2})/)){const r=ok(+m[1],+m[2],+m[3]);if(r)return r}
  if(m=text.match(/(\d{1,2})[\/.](\d{1,2})[\/.](\d{4}|\d{2})\b/)){let a=+m[1],b=+m[2];if(b>12){[a,b]=[b,a]}const r=ok(fix(+m[3]),b,a);if(r)return r}
  return null;
}
function titleCase(s){return /[a-z]/.test(s)?s:s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase())}
function parseReceipt(raw){
  const text=String(raw||'').replace(/\u00A0/g,' ');
  const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const out={type:'expense',amount:'',date:null,merchant:'',category:'Others',det:{}};
  // amount
  const re=/(?<![A-Za-z0-9])(?:₦|NGN|N|#|\$|£|€|GH₵|KSh|R)\s?(\d{1,3}(?:[,\s]\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)/gi;
  const cands=[];
  for(const l of lines){let m;re.lastIndex=0;while((m=re.exec(l))){const v=parseFloat(m[1].replace(/[,\s]/g,''));if(v>0)cands.push({v,l,bad:/balance|\bbal\b|fee|charge|vat|stamp|limit/i.test(l),lab:/amount|total|paid|sent|debit|credit|transfer/i.test(l)})}}
  if(!cands.length){const m=text.match(/\b\d{1,3}(?:,\d{3})+\.\d{2}\b/);if(m)cands.push({v:parseFloat(m[0].replace(/,/g,'')),l:m[0],bad:false,lab:true})}
  const good=cands.filter(c=>!c.bad);const pool=good.length?good:cands;
  if(pool.length){const pick=pool.find(c=>c.lab)||pool.sort((a,b)=>b.v-a.v)[0];out.amount=String(pick.v);out.det.amount=true}
  // date
  const dt=parseDate(text);if(dt){out.date=dt;out.det.date=true}
  // type
  const t=text.toLowerCase();
  if(/refund|reversal|reversed/.test(t))out.type='refund';
  else if(/own account|self transfer|between your accounts|to savings|savings wallet/.test(t))out.type='transfer';
  else if(/credit alert|credited|received|deposit|salary|inward|payment received|\bcr\b/.test(t)&&!/debit|debited|sent to|transfer to|purchase|paid to/.test(t))out.type='income';
  out.det.type=true;
  // merchant
  const lab=out.type==='income'?/^(?:from|sender|credited by|received from|payer)(?:\s*[:\-]\s*|\s+|$)(.*)$/i:/^(?:to|recipient|beneficiary|merchant|paid to|sent to|payee|biller|recipient name)(?:\s*[:\-]\s*|\s+|$)(.*)$/i;
  for(let i=0;i<lines.length;i++){const m=lines[i].match(lab);if(m){let v=m[1].trim()||(lines[i+1]||'');v=v.replace(/\s*[\-|]?\s*\d{6,}.*$/,'').replace(/[^\w &'.\-]/g,'').trim();if(v.length>=2){out.merchant=titleCase(v).slice(0,60);out.det.merchant=true;break}}}
  if(!out.merchant){const l=lines.find(x=>/[A-Za-z]{3,}/.test(x)&&!/bank|successful|transfer|receipt|transaction|alert|date|reference|ref\b|status|amount|balance|session|time|narration|total|paid|\d{5,}/i.test(x)&&x.length<40);if(l){out.merchant=titleCase(l.replace(/[^\w &'.\-]/g,'').trim());out.det.merchant=true}}
  out.category=guessCategory(text+' '+out.merchant,out.type,out.merchant);
  if(out.category!=='Others'||out.type==='income')out.det.category=true;
  return out;
}

/* ================= dashboard ================= */
function lineChart(B){
  const W=640,H=250,L=54,Rr=14,T=14,Bt=30,mx=niceMax(Math.max(...B.map(b=>Math.max(b.income,b.expense)),1));
  const x=i=>L+(W-L-Rr)*i/(B.length-1),y=v=>T+(H-T-Bt)*(1-v/mx);
  const ip=B.map((b,i)=>[x(i),y(b.income)]),ep=B.map((b,i)=>[x(i),y(b.expense)]);
  const area=smooth(ep,T,H-Bt)+`L${x(B.length-1).toFixed(1)},${(H-Bt)}L${x(0).toFixed(1)},${(H-Bt)}Z`;
  const ticks=[0,1,2,3,4].map(k=>mx*k/4);
  const every=Math.ceil(B.length/6);
  window._chart={B,x,y,W,H,T,Bt};
  return`<div class="chart-host" style="position:relative"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and spending over time">
   <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".28"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="${v?'3 4':'0'}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v?sym()+compact(v):'0'}</text>`).join('')}
   <path d="${area}" fill="url(#ga)" fill-rule="nonzero" stroke="none"/>
   <path d="${smooth(ip,T,H-Bt)}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
   <path d="${smooth(ep,T,H-Bt)}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
   ${B.map((b,i)=>i%every===0||i===B.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':i===B.length-1?'end':'middle'}">${b.label}</text>`:'').join('')}
   <g id="hv" style="display:none"><line id="hl" y1="${T}" y2="${H-Bt}" stroke="var(--muted)" stroke-dasharray="3 3"/><circle id="hi" r="5" fill="var(--surface)" stroke="var(--green)" stroke-width="2.5"/><circle id="he" r="5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/></g>
  </svg><div class="chart-tip" id="ctip" style="display:none"></div></div>`;
}
function donut(byCat,total,size=170){
  const cats=EXP_CATS.filter(c=>byCat[c]>0).sort((a,b)=>byCat[b]-byCat[a]);const r=62,C=2*Math.PI*r;let acc=0;
  const segs=cats.map(c=>{const len=byCat[c]/total*C,gap=cats.length>1?2.5:0;const s=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="${CAT[c].c}" stroke-width="22" stroke-dasharray="${Math.max(len-gap,.1)} ${C-Math.max(len-gap,.1)}" stroke-dashoffset="${-acc}" transform="rotate(-90 85 85)"><title>${c}: ${money(byCat[c])}</title></circle>`;acc+=len;return s}).join('');
  return`<div class="donut" style="width:${size}px;height:${size}px"><svg viewBox="0 0 170 170" width="${size}" height="${size}" role="img" aria-label="Spending by category"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="22"/>${segs}</svg><div class="ctr"><b class="num">${money(total)}</b><span>Total spent</span></div></div>`;
}
function legend(byCat,total){
  const cats=EXP_CATS.filter(c=>byCat[c]>0).sort((a,b)=>byCat[b]-byCat[a]);

}

  const ex=expectedIncome();

/* ================= transactions ================= */
function filteredTx(){
  const u=S.ui,q=u.q.trim().toLowerCase();
  return S.data.tx.filter(t=>(u.type==='all'||t.type===u.type)&&(u.cat==='all'||t.category===u.cat)&&(u.month==='all'||t.date.slice(0,7)===u.month)
    &&(!q||(t.merchant||'').toLowerCase().includes(q)||t.category.toLowerCase().includes(q)||(t.note||'').toLowerCase().includes(q)||String(t.amount).includes(q.replace(/,/g,''))))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
}
function txListHTML(){
  const L=filteredTx();if(!L.length)return`<div class="empty"><span class="ic">${ic('search')}</span><h2 style="font-size:17px">${S.data.tx.length?'Nothing matches those filters':'No transactions yet'}</h2><p>${S.data.tx.length?'Try a different word or clear a filter.':'Add one from a screenshot or by hand.'}</p></div>`;
  const shown=L.slice(0,S.ui.limit);let out='',day='';

/* ================= add transaction flow ================= */
function startFlow(manual){

}

   ${cats.length?`<div class="field full"><span class="lbl">Category${tag('category')}</span><div class="cat-pick" role="group" aria-label="Category">${cats.map(c=>`<button type="button" class="chip" data-a="cat" data-v="${c}" aria-pressed="${d.category===c}">${ic(CAT[c].i,'')}${c}</button>`).join('')}</div></div>`:''}
   <div class="field full"><label for="f-note">Note (optional)</label><input id="f-note" class="input" data-f="note" value="${esc(d.note)}" placeholder="Anything to remember about this"></div></div>`;
}
function findDup(d,fp,skipId){
  const a=parseAmt(d.amount);if(!a)return null;
  return S.data.tx.find(t=>t.id!==skipId&&((fp&&t.fp===fp)||(t.amount===a&&t.date===d.date&&t.type===d.type&&((t.merchant||'').toLowerCase()===(d.merchant||'').trim().toLowerCase()||!d.merchant))))||null;
}
function validateDraft(d){
  if(!(parseAmt(d.amount)>0))return'Enter an amount greater than zero.';
  if(!d.date||isNaN(parseISO(d.date)))return'Choose the date of the transaction.';
  if(d.date>todayISO())return'That date is in the future. Pick today or earlier.';
  return'';
}

/* ================= reports ================= */
function reportMonths(){const t=todayISO();return Array.from({length:12},(_,i)=>addMonthsISO(t,-i))}
function viewReports(){
  const t=todayISO(),M=S.ui.repMonth||monthStart(t),tom=addDaysISO(t,1);
  const end=minISO(addMonthsISO(M,1),tom),pS=addMonthsISO(M,-1),pE=minISO(addDaysISO(pS,dayDiff(M,end)),M);
  const c=agg(M,end),p=agg(pS,pE),net=c.income-c.expense,rate=c.income>0?Math.round(net/c.income*100):0;
  const part=end<addMonthsISO(M,1);
  const head=`<div class="page-head"><div><h1>Monthly report</h1><p>${part?'Month so far, compared with the same days last month.':'The full month, compared with the one before.'}</p></div>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><select class="select select-sm" data-ch="repMonth" aria-label="Month">${reportMonths().map(m=>`<option value="${m}" ${m===M?'selected':''}>${monthLabel(m)}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" data-a="copycsv">${ic('copy')}Copy as CSV</button></div></div>`;
  if(!c.n)return head+`<div class="card"><div class="empty"><span class="ic">${ic('chart')}</span><h2 style="font-size:18px">Nothing recorded in ${monthLabel(M)}</h2><p>Pick another month or add a transaction.</p></div></div>`;
  const kp=(l,v,d,cls='')=>`<div class="card kpi"><span class="l">${l}</span><span class="v num ${cls}">${v}</span>${d}</div>`;
  const merch={};for(const x of S.data.tx)if(x.date>=M&&x.date<end&&x.type==='expense'){const k=(x.merchant||x.category).toLowerCase();(merch[k]=merch[k]||{n:x.merchant||x.category,v:0,c:0});merch[k].v+=x.amount;merch[k].c++}
  const topM=Object.values(merch).sort((a,b)=>b.v-a.v).slice(0,5);
  const big=S.data.tx.filter(x=>x.date>=M&&x.date<end&&x.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,3);

function csvFor(M){

async function doSignup(f){
  const name=f.name.value.trim(),email=f.email.value.trim().toLowerCase(),pw=f.pw.value;
  const bad=!name?'Tell us your name so we can greet you properly.':!/^\S+@\S+\.\S+$/.test(email)?'Enter a valid email address, like you@example.com.':pw.length<8?'Use at least 8 characters for your password.':'';
  if(bad){S.ui.err=bad;render();return}

  const salt=Math.random().toString(36).slice(2);
  acc[email]={name,salt,hash:await hashPw(pw,salt)};store.set('finora:accounts',acc);
  store.set('finora:data:'+email,newData(name,email));
  S.ui.onb=1;S.ui.onbD={};signIn(email);
}
async function doLogin(f){
  const email=f.email.value.trim().toLowerCase(),pw=f.pw.value,acc=accounts()[email];
  if(!email||!pw){S.ui.err='Enter your email and password.';render();return}

}

/* ================= add-transaction flow ================= */
function updProg(F){const b=$('#pbar'),s=$('#pstat');if(b)b.style.width=F.progress+'%';if(s)s.textContent=F.status}
function applyParsed(F,res){
  const d=F.draft;d.type=res.type;d.amount=res.amount?Number(res.amount).toLocaleString('en-US',{maximumFractionDigits:2}):'';d.date=res.date||todayISO();d.merchant=res.merchant||'';
  d.category=res.type==='transfer'?'Transfer':res.category;d.catTouched=false;F.det=res.det;
  if(!res.amount)F.ocrFailed=true;
}
async function handleFile(file){
  if(!file)return;
  if(!/^image\/(png|jpe?g|webp)$/.test(file.type)){toast('Choose a PNG, JPG or WebP image.');return}
  if(file.size>10*1024*1024){toast('That image is over 10 MB. Try a smaller screenshot.');return}
  startFlow(false);const F=S.flow;F.step=2;F.status='Opening your screenshot';F.progress=8;
  F.fp=`${file.name}|${file.size}|${file.lastModified}`;
  if(S.route!=='add')go('add');else render();
  const url=URL.createObjectURL(file);F.thumb=await makeThumb(url);URL.revokeObjectURL(url);
  if(S.flow!==F)return;render();
  F.progress=22;F.status='Preparing the text reader';updProg(F);
  let text=null;
  try{text=await runOCR(file,(p,s)=>{if(S.flow===F){F.progress=p;F.status=s;updProg(F)}})}catch(e){F.ocrFailed=true}
  if(S.flow!==F)return;
  if(text){F.progress=95;F.status='Matching a category';updProg(F);applyParsed(F,parseReceipt(text))}
  await new Promise(r=>setTimeout(r,350));
  if(S.flow!==F)return;F.step=3;render();
}
async function runSample(){
  startFlow(false);const F=S.flow;F.sample=true;F.step=2;const s=sampleShot();F.thumb=s.url;F.fp='sample|'+todayISO();
  if(S.route!=='add')go('add');else render();
  const steps=[[18,'Reading the text'],[48,'Finding the amount'],[74,'Spotting the date and who was paid'],[94,'Suggesting a category']];
  for(const [p,t] of steps){F.progress=p;F.status=t;updProg(F);await new Promise(r=>setTimeout(r,520));if(S.flow!==F)return}
  applyParsed(F,parseReceipt(s.text));F.step=3;render();
}
function draftOf(el){const form=el.closest('[data-form]');return form?(form.dataset.form==='flow'?S.flow.draft:S.edit.draft):null}
function refreshDup(){
  const F=S.flow,el=$('#dup');if(!F||!el)return;const dup=findDup(F.draft,F.fp);
  if(dup){el.className='notice warn';el.innerHTML=`${ic('alert')}<span>This looks like <b>${esc(txTitle(dup))}</b> for ${money(dup.amount)} on ${fmtDay(dup.date)}, which you already saved. Save it only if it is a separate transaction.</span>`}
  else{el.className='';el.innerHTML=''}
}
function showErr(msg,focus){const e=$('#ferr');if(e){e.hidden=false;e.innerHTML=`${ic('alert')}<span>${esc(msg)}</span>`}if(focus){const f=$(focus);if(f)f.focus()}}
function buildTx(d,extra){
  const type=d.type;return{id:uid(),type,amount:parseAmt(d.amount),date:d.date,merchant:d.merchant.trim(),category:type==='transfer'?'Transfer':d.category,note:(d.note||'').trim(),created:Date.now(),...extra};
}
function saveFlowTx(){
  const F=S.flow,d=F.draft,err=validateDraft(d);
  if(err){F.err=err;showErr(err,!(parseAmt(d.amount)>0)?'#f-amount':'#f-date');return}
  const t=buildTx(d,{source:F.thumb&&!F.sample?'screenshot':F.sample?'screenshot':'manual',img:F.thumb||null,fp:F.fp||null});
  S.data.tx.push(t);
  if(t.merchant&&t.type!=='transfer')S.data.merchantMap[t.merchant.toLowerCase()]=t.category;
  persist();
  let b=null;
  if(t.type==='expense'){const bs=budgetStates().find(x=>x.cat===t.category);
    if(bs&&bs.limit)b={k:bs.status==='ok'?'ok':'warn',h:bs.status==='bad'?`${t.category} is now <b>${money(bs.spent-bs.limit)} over</b> its ${money(bs.limit)} budget.`:`${t.category} budget is <b>${bs.pct}% used</b>: ${money(bs.spent)} of ${money(bs.limit)}.`}}
  F.saved=t;F.budgetMsg=b;F.step=4;render();
}
function saveEdit(){
  const E=S.edit,err=validateDraft(E.draft);
  if(err){E.err=err;showErr(err,'#f-amount');return}
  const t=S.data.tx.find(x=>x.id===E.id);if(!t)return;const d=E.draft;
  t.type=d.type;t.amount=parseAmt(d.amount);t.date=d.date;t.merchant=d.merchant.trim();t.category=d.type==='transfer'?'Transfer':d.category;t.note=(d.note||'').trim();
  if(t.merchant&&t.type!=='transfer')S.data.merchantMap[t.merchant.toLowerCase()]=t.category;
  persist();S.modal={t:'tx',id:t.id};S.edit=null;S.ui.del=null;render();toast('Changes saved');
}
function validCat(d){const L=d.type==='income'?INC_CATS:d.type==='transfer'?['Transfer']:EXP_CATS;if(!L.includes(d.category))d.category=L[0]}
function twoStep(key,fn){
  if(S.ui.del===key){S.ui.del=null;fn();return}
  S.ui.del=key;render();setTimeout(()=>{if(S.ui.del===key){S.ui.del=null;render()}},4000);
}

/* ================= actions ================= */
const A={
  go(el){S.modal=null;S.pop=null;S.ui.del=null;S.ui.editBud=null;const r=el.dataset.r;if(r==='add')startFlow(false);go(r)},
  showpw(el){S.ui.showPw=!S.ui.showPw;const i=$('#a-pw');if(i)i.type=S.ui.showPw?'text':'password';el.textContent=S.ui.showPw?'Hide':'Show'},
  forgot(){S.ui.err='Password reset needs email delivery, which this preview does not have. Create a new account with a different email, or explore the demo.';render()},
  demo(){enterDemo()},
  scroll(el){const t=document.getElementById(el.dataset.t);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})},
  signout(){signOut()},
  bell(){if(S.pop==='bell'){S.pop=null;render();return}S.pop='bell';render();S.data.seenAlerts=alerts().filter(a=>a.k!=='ok').length;persist()},
  more(){S.modal={t:'more'};render()},
  close(){S.modal=null;S.edit=null;S.ui.del=null;render()},
  scrim(el,e){if(e.target===el)A.close()},
  'onb-back'(){readOnb();S.ui.onb=Math.max(1,S.ui.onb-1);S.ui.err=null;render()},
  'onb-skip'(){readOnb();onbNext()},
  pick(){const f=$('#file');if(f)f.click()},
  manual(){startFlow(true);if(S.route!=='add')go('add');else render()},
  sample(){runSample()},
  discard(){startFlow(false);render()},
  again(){startFlow(false);render()},
  ftype(el){const form=el.closest('[data-form]');const d=form.dataset.form==='flow'?S.flow.draft:S.edit.draft;d.type=el.dataset.v;d.catTouched=false;validCat(d);render()},
  cat(el){const d=draftOf(el);d.category=el.dataset.v;d.catTouched=true;el.closest('.cat-pick').querySelectorAll('[data-a=cat]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)))},
  'ftype-f'(el){S.ui.type=el.dataset.v;S.ui.limit=50;render()},
  'more-tx'(){S.ui.limit+=50;$('#txlist').innerHTML=txListHTML()},
  'open-tx'(el){S.modal={t:'tx',id:el.dataset.id};S.ui.del=null;render()},
  'edit-tx'(el){const t=S.data.tx.find(x=>x.id===el.dataset.id);if(!t)return;S.edit={id:t.id,err:null,draft:{type:t.type,amount:String(t.amount),date:t.date,merchant:t.merchant||'',category:t.category,note:t.note||'',catTouched:true}};validCat(S.edit.draft);S.modal={t:'edit'};render()},
  'del-tx'(el){const id=el.dataset.id;twoStep('tx',()=>{const i=S.data.tx.findIndex(x=>x.id===id);if(i<0)return;const [t]=S.data.tx.splice(i,1);persist();S.modal=null;render();toast('Transaction deleted',()=>{S.data.tx.push(t);persist();render()})})},
  'del-shot'(el){const id=el.dataset.id;twoStep('shot',()=>{const t=S.data.tx.find(x=>x.id===id);if(t){t.img=null;persist()}render();toast('Screenshot deleted. The transaction is still there.')})},
  'goal-new'(){S.modal={t:'goal'};render()},
  'goal-del'(el){const id=el.dataset.id;twoStep('g'+id,()=>{const i=S.data.goals.findIndex(g=>g.id===id);if(i<0)return;const [g]=S.data.goals.splice(i,1);persist();render();toast(`${g.name} deleted`,()=>{S.data.goals.splice(i,0,g);persist();render()})})},
  'bud-edit'(el){S.ui.editBud=el.dataset.c;render()},
  'bud-cancel'(){S.ui.editBud=null;render()},
  'income-new'(){S.modal={t:'income'};render()},
  'income-del'(el){const i=S.data.profile.incomeSources.findIndex(s=>s.id===el.dataset.id);if(i>=0){S.data.profile.incomeSources.splice(i,1);persist();render()}},
  theme(el){setTheme(el.dataset.v)},
  'shots-del'(){twoStep('shots',()=>{S.data.tx.forEach(t=>t.img=null);persist();render();toast('All screenshots deleted')})},
  loadsample(){const go2=()=>{const d=newData(S.data.profile.name,S.user);d.profile.theme=S.data.profile.theme;d.profile.currency=S.data.profile.currency;seedDemo(d);d.profile.demo=false;S.data=d;persist();location.hash='dashboard';render();toast('Sample data loaded. You can reset it any time in Settings.')};if(S.data.tx.length)twoStep('sample',go2);else go2()},
  reset(){twoStep('reset',()=>{const p=S.data.profile;S.data=newData(p.name,p.email);Object.assign(S.data.profile,{currency:p.currency,theme:p.theme,onboarded:true});persist();render();toast('Your data was reset')})},
  delacct(){twoStep('acct',()=>{const acc=accounts();delete acc[S.user];store.set('finora:accounts',acc);store.del('finora:data:'+S.user);signOut();toast('Account deleted')})},
  copycsv(){const csv=csvFor(S.ui.repMonth||monthStart(todayISO()));
    const fail=()=>{S.ui.csv=csv;render();setTimeout(()=>{const t=$('#csvbox');if(t){t.focus();t.select()}},30)};
    try{navigator.clipboard.writeText(csv).then(()=>toast('Copied. Paste it into a spreadsheet.')).catch(fail)}catch(e){fail()}},
  closecsv(){S.ui.csv=null;render()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(S.pop==='bell'&&!e.target.closest('.pop')&&!(el&&el.dataset.a==='bell')){S.pop=null;render();if(!el)return}
  if(!el)return;const fn=A[el.dataset.a];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal)A.close();else if(S.pop){S.pop=null;render()}}});

/* ---------- forms ---------- */
const SUB={
  login:doLogin,signup:doSignup,onb:doOnb,
  gsearch(f){S.ui.q=f.querySelector('input').value;S.ui.type='all';S.ui.cat='all';S.ui.month='all';S.ui.limit=50;go('transactions')},
  tx:saveFlowTx,edit:saveEdit,
  goal(f){const n=f.name.value.trim(),t=parseAmt(f.target.value),s=parseAmt(f.start.value);
    if(!n||!(t>0)){showErr('Name the goal and enter a target amount above zero.',!n?'#g-n':'#g-t');return}
    S.data.goals.push({id:uid(),name:n,target:t,start:Math.min(s,t),date:f.date.value||null,contribs:[]});persist();S.modal=null;render();toast(`${n} created`)},
  contrib(f){const a=parseAmt(f.amt.value),g=S.data.goals.find(x=>x.id===f.dataset.id);if(!g)return;
    if(!(a>0)){f.amt.focus();toast('Enter an amount above zero.');return}
    const before=goalSaved(g);g.contribs.push({date:todayISO(),amount:a});persist();render();
    toast(before<g.target&&goalSaved(g)>=g.target?`${g.name} goal reached`:`Added ${money(a)} to ${g.name}`)},
  budget(f){const v=parseAmt(f.limit.value),c=f.dataset.c;if(v>0)S.data.budgets[c]=v;else delete S.data.budgets[c];persist();S.ui.editBud=null;render();toast(v>0?`${c} limit set to ${money(v)}`:`${c} limit removed`)},
  income(f){const n=f.name.value.trim(),a=parseAmt(f.amount.value);
    if(!n||!(a>0)){showErr('Name the income source and enter an amount above zero.',!n?'#i-n':'#i-a');return}
    S.data.profile.incomeSources.push({id:uid(),name:n,amount:a,freq:f.freq.value,day:Math.min(28,Math.max(1,parseInt(f.day.value)||1))});persist();S.modal=null;render()}
};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fn=SUB[f.dataset.submit];if(fn)fn(f)});

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.q!==undefined){S.ui.q=el.value;S.ui.limit=50;$('#txlist').innerHTML=txListHTML();return}
  const k=el.dataset.f;if(!k)return;const d=draftOf(el);if(!d)return;
  d[k]=el.value;
  if(k==='merchant'&&!d.catTouched&&d.type!=='transfer'){
    const g=guessCategory(d.merchant,d.type,d.merchant);const L=d.type==='income'?INC_CATS:EXP_CATS;
    if(L.includes(g)&&(g!=='Others'&&g!=='Other income'||S.data.merchantMap[d.merchant.toLowerCase().trim()])){d.category=g;el.closest('[data-form]').querySelectorAll('[data-a=cat]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===g)))}
  }
  if(el.closest('[data-form]').dataset.form==='flow')refreshDup();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='file'){handleFile(el.files[0]);return}
  const k=el.dataset.ch;if(!k)return;
  if(k==='period'){S.ui.period=el.value;render()}
  else if(k==='month'||k==='cat'){S.ui[k]=el.value;S.ui.limit=50;render()}
  else if(k==='repMonth'){S.ui.repMonth=el.value;S.ui.csv=null;render()}
  else if(k==='name'){const v=el.value.trim();if(v){S.data.profile.name=v;persist();render();toast('Name updated')}}
  else if(k==='currency'){S.data.profile.currency=el.value;persist();render();toast(`Amounts now show in ${CUR[el.value][1]}`)}
  else if(k==='opening'){S.data.profile.openingBalance=parseAmt(el.value);persist();render();toast('Starting balance updated')}
});

/* drag, drop, paste */
document.addEventListener('dragover',e=>{e.preventDefault();const d=e.target.closest&&e.target.closest('.drop');document.querySelectorAll('.drop.over').forEach(x=>{if(x!==d)x.classList.remove('over')});if(d)d.classList.add('over')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget){document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'))}});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));
  if(S.route==='add'&&S.flow&&S.flow.step===1){const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f)}});
document.addEventListener('paste',e=>{
  if(S.route!=='add'||!S.flow||S.flow.step!==1||!e.clipboardData)return;
  const f=[...e.clipboardData.files].find(x=>x.type.startsWith('image/'));if(f){e.preventDefault();handleFile(f)}
});

/* chart hover */
function chartPoint(e){
  const host=e.target.closest&&e.target.closest('.chart-host');if(!host||!window._chart)return;
  const svg=host.querySelector('svg'),r=svg.getBoundingClientRect(),C=window._chart;
  const cx=e.touches?e.touches[0].clientX:e.clientX,vx=(cx-r.left)/r.width*C.W;
  let best=0,bd=1e9;C.B.forEach((b,i)=>{const dd=Math.abs(C.x(i)-vx);if(dd<bd){bd=dd;best=i}});
  const b=C.B[best],X=C.x(best);
  host.querySelector('#hv').style.display='';
  const hl=host.querySelector('#hl');hl.setAttribute('x1',X);hl.setAttribute('x2',X);
  const hi=host.querySelector('#hi'),he=host.querySelector('#he');hi.setAttribute('cx',X);hi.setAttribute('cy',C.y(b.income));he.setAttribute('cx',X);he.setAttribute('cy',C.y(b.expense));
  const tip=host.querySelector('#ctip');tip.style.display='';
  tip.innerHTML=`<div style="opacity:.75;margin-bottom:2px">${esc(b.label)}</div><div>Income <b>${money(b.income)}</b></div><div>Spent <b>${money(b.expense)}</b></div>`;
  tip.style.left=Math.min(Math.max(X/C.W*r.width,60),r.width-60)+'px';tip.style.top=(Math.min(C.y(b.income),C.y(b.expense))/C.H*r.height)+'px';
}
document.addEventListener('mousemove',chartPoint);
document.addEventListener('touchmove',chartPoint,{passive:true});
document.addEventListener('touchstart',chartPoint,{passive:true});
document.addEventListener('mouseout',e=>{const h=e.target.closest&&e.target.closest('.chart-host');if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget))){const v=h.querySelector('#hv'),t=h.querySelector('#ctip');if(v)v.style.display='none';if(t)t.style.display='none'}});

/* ================= boot ================= */
(function boot(){
  const s=store.get('finora:session');
  if(s&&store.get('finora:data:'+s)){
    const d=store.get('finora:data:'+s);d.tx=d.tx||[];d.goals=d.goals||[];d.budgets=d.budgets||{};d.merchantMap=d.merchantMap||{};d.profile.incomeSources=d.profile.incomeSources||[];
    S.user=s;S.data=d;
  }
  render();
})();

</script>
</body>
